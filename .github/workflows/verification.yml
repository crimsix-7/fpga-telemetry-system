name: Verification

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            make \
            g++ \
            autoconf \
            flex \
            bison \
            help2man \
            perl \
            libfl-dev \
            zlib1g \
            zlib1g-dev \
            liblz4-dev

      - name: Build Verilator
        run: |
          git clone --depth 1 --branch stable https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure
          make -j"$(nproc)"
          sudo make install
          verilator --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full regression suite
        run: |
          make regression